[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-motor-monitor"
version = "1.0.0"
description = "Context-aware predictive maintenance for industrial drive motors: ESP32 edge node, MQTT, Random Forest classification and short-horizon forecasting."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Lohitashva V S" },
  { name = "Prabhanjan G H" },
  { name = "Jayaprakash L" },
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
dashboard = ["dash>=2.14", "plotly>=5.18", "paho-mqtt>=2.0", "gunicorn>=21.2"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
